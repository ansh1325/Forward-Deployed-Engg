version: '3.8'

services:
  legacy-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: legacy-mssql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FdeEnterprisePass123!"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  mssql_data:
    driver: local
